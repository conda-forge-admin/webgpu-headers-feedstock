{% set githash_version = "673658bc2bd70ec39fc55ebe6bb0173cf6d0a603" %}
{% set version = "0.0.0.2026.5.7." + githash_version[:7] %}

package:
  name: webgpu-headers
  version: {{ version }}

source:
  url: https://github.com/webgpu-native/webgpu-headers/archive/{{ githash_version }}.tar.gz
  sha256: 6754c6c2465c79a954f7c04c7890c9f00b7ecce8addbe01b5056e860ba3933e6

build:
  noarch: generic
  number: 0

requirements:
  run:
    - __unix  # [unix]
    - __win   # [win]

test:
  commands:
    - test -f ${PREFIX}/include/webgpu.h   # [unix]
    - if not exist %PREFIX%\\Library\\include\\webgpu.h exit 1  # [win]

about:
  home: https://github.com/webgpu-native/webgpu-headers
  summary: WebGPU Headers
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
